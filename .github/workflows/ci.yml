name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: make lint
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
        # setup-python has no 3.9 build for Ubuntu 26.04 (ubuntu-latest); 24.04 still has one.
        exclude:
          - { os: ubuntu-latest, python: "3.9" }
        include:
          - { os: ubuntu-24.04, python: "3.9" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Manifests are valid JSON and carry one version
        run: |
          python3 - <<'PY'
          import json
          plugin = json.load(open(".claude-plugin/plugin.json"))
          market = json.load(open(".claude-plugin/marketplace.json"))
          json.load(open("hooks/hooks.json"))
          versions = {plugin["version"], market["plugins"][0]["version"]}
          assert len(versions) == 1, f"versions differ: {versions}"
          PY
      - name: Tests
        run: python3 -m unittest discover -s tests -v
