name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag, manifests and changelog agree
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          for file in .claude-plugin/plugin.json .claude-plugin/marketplace.json; do
            grep -qF "\"version\": \"${version}\"" "${file}" || {
              echo "${file} does not carry version ${version}" >&2; exit 1; }
          done
          grep -qF "## [${version}] - " CHANGELOG.md || {
            echo "CHANGELOG.md has no section for ${version}" >&2; exit 1; }

      - name: Cut release notes from the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          awk -v h="## [${version}] - " '
            index($0, h) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { next }
            on { print }
          ' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > "${RUNNER_TEMP}/release-notes.md"
          test -s "${RUNNER_TEMP}/release-notes.md" || { echo "release notes are empty" >&2; exit 1; }
          cat "${RUNNER_TEMP}/release-notes.md"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" --title "${TAG}" --notes-file "${RUNNER_TEMP}/release-notes.md" --verify-tag
